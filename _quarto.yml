project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "en/*.qmd"

lang: it

website:
  title: "Erasmo Vassallo"
  site-url: https://erasmovassallo.github.io
  description: "Erasmo Vassallo — Università degli Studi di Palermo"
  page-navigation: false
  search: false
  navbar:
    background: light
    left:
      - text: "CV"
        href: cv.qmd
      - text: "Didattica"
        href: didattica.qmd
      - text: "Pubblicazioni"
        href: pubblicazioni.qmd
    right:
      - text: "English"
        href: en/index.qmd
      - icon: github
        href: https://github.com/erasmovassallo
        aria-label: GitHub
  page-footer:
    center: "© 2026 Erasmo Vassallo"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    smooth-scroll: true
    include-after-body: _includes/lang-switch.html
